<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#d91f2d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d91f2d" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Controller Icon with Speed Lines -->
  <g transform="translate(4, 8)">
    <!-- Speed Motion Trails -->
    <path d="M4 14 H16" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M0 22 H14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M6 30 H18" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Controller Body -->
    <g transform="translate(18, 0)" filter="url(#glow)">
      <!-- Main Controller Shell -->
      <path d="M12 8 C18 4, 34 4, 40 8 C46 12, 50 26, 44 38 C42 42, 36 44, 32 40 L28 32 C27 30, 25 30, 24 32 L20 40 C16 44, 10 42, 8 38 C2 26, 6 12, 12 8 Z" fill="url(#logoRedGrad)"/>
      
      <!-- Top Grip Detail -->
      <path d="M16 10 C22 8, 30 8, 36 10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

      <!-- D-Pad (Left) -->
      <path d="M15 19 V27 M11 23 H19" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Action Buttons (Right) -->
      <circle cx="34" cy="19" r="1.5" fill="#ffffff"/>
      <circle cx="38" cy="23" r="1.5" fill="#ffffff"/>
      <circle cx="34" cy="27" r="1.5" fill="#ffffff"/>
      <circle cx="30" cy="23" r="1.5" fill="#ffffff"/>
      
      <!-- Center Home Button -->
      <circle cx="26" cy="23" r="2" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Typography: TOKIYO STORE -->
  <g transform="translate(74, 41)">
    <!-- TOKIYO in Crisp Pure White -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="27" font-weight="900" letter-spacing="1.5" fill="#ffffff">
      TOKIYO
    </text>
    
    <!-- STORE in Vibrant Crimson Red Gradient -->
    <text x="122" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="27" font-weight="900" letter-spacing="1.5" fill="url(#logoRedGrad)">
      STORE
    </text>

    <!-- Sleek Red Underline Accent beneath STORE -->
    <rect x="122" y="5" width="88" height="3" rx="1.5" fill="url(#logoRedGrad)"/>
  </g>
</svg>
