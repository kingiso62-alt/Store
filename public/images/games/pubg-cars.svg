<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="carsBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b080d"/>
      <stop offset="60%" stop-color="#140306"/>
      <stop offset="100%" stop-color="#050002"/>
    </radialGradient>
    <linearGradient id="redCar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a2d"/>
      <stop offset="50%" stop-color="#dc1424"/>
      <stop offset="100%" stop-color="#990b16"/>
    </linearGradient>
    <linearGradient id="wheelRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="50%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="36" fill="url(#carsBg)"/>

  <!-- Speed Glow & Red Neon Aura -->
  <circle cx="250" cy="220" r="150" fill="#dc1424" opacity="0.25" filter="url(#glowRed)"/>
  
  <!-- Red Hypercar / Supercar Silhouette & 3D Vector -->
  <g transform="translate(0, 10)">
    <!-- Headlight Beams -->
    <polygon points="100,240 20,290 80,300 130,250" fill="#ff4d5a" opacity="0.3" filter="url(#glowRed)"/>
    <polygon points="400,240 480,290 420,300 370,250" fill="#ff4d5a" opacity="0.3" filter="url(#glowRed)"/>

    <!-- Car Body -->
    <path d="M 90,260 Q 140,210 210,185 Q 250,175 290,185 Q 360,210 410,260 L 440,270 Q 420,305 380,310 L 120,310 Q 80,305 60,270 Z" fill="url(#redCar)" filter="url(#glowRed)"/>
    
    <!-- Windshield & Cockpit -->
    <path d="M 170,225 Q 250,185 330,225 L 350,250 Q 250,240 150,250 Z" fill="#0f172a" stroke="#dc1424" stroke-width="1.5"/>
    
    <!-- Aerodynamic Hood Lines -->
    <path d="M 210,185 L 180,260 L 250,270 L 320,260 L 290,185" fill="#b91c1c"/>
    <path d="M 250,180 L 250,270" stroke="#fca5a5" stroke-width="2"/>

    <!-- LED Headlights -->
    <path d="M 120,250 Q 150,245 170,252 L 160,262 Q 130,258 115,258 Z" fill="#ffffff" filter="url(#glowRed)"/>
    <path d="M 380,250 Q 350,245 330,252 L 340,262 Q 370,258 385,258 Z" fill="#ffffff" filter="url(#glowRed)"/>

    <!-- Front Grille & Carbon Splitter -->
    <rect x="180" y="275" width="140" height="28" rx="6" fill="#020617"/>
    <line x1="190" y1="285" x2="310" y2="285" stroke="#dc1424" stroke-width="2"/>
    <line x1="190" y1="293" x2="310" y2="293" stroke="#dc1424" stroke-width="2"/>

    <!-- Wheels / Tires -->
    <g transform="translate(110, 295)">
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="#020617"/>
      <ellipse cx="0" cy="0" rx="16" ry="11" fill="url(#wheelRim)"/>
    </g>
    <g transform="translate(390, 295)">
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="#020617"/>
      <ellipse cx="0" cy="0" rx="16" ry="11" fill="url(#wheelRim)"/>
    </g>

    <!-- Speed Sparks -->
    <circle cx="90" cy="290" r="3" fill="#ffdf40" filter="url(#glowRed)"/>
    <circle cx="410" cy="290" r="3" fill="#ffdf40" filter="url(#glowRed)"/>
  </g>

  <!-- PUBG CARS Banner Label -->
  <g transform="translate(250, 390)">
    <rect x="-150" y="-35" width="300" height="52" rx="10" fill="rgba(18, 3, 6, 0.95)" stroke="#dc1424" stroke-width="2.5" filter="url(#glowRed)"/>
    <text x="0" y="-8" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="3" font-family="sans-serif">PUBG MOBILE</text>
    <text x="0" y="10" fill="#ff3344" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="3" font-family="sans-serif">CARS &amp; SUPERCARS</text>
  </g>
</svg>
