<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="xsuitBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1038"/>
      <stop offset="60%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>
    <linearGradient id="goldArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="50%" stop-color="#ffa751"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glowMythic" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="36" fill="url(#xsuitBg)"/>

  <!-- Mystic Aura & Halo -->
  <circle cx="250" cy="180" r="130" fill="#a855f7" opacity="0.28" filter="url(#glowMythic)"/>
  <circle cx="250" cy="180" r="85" fill="none" stroke="#e9d5ff" stroke-width="2" opacity="0.5" stroke-dasharray="8,6" filter="url(#glowMythic)"/>

  <!-- Mythic Wings / Feathers (Fiore & Galadria X-Suit style) -->
  <g transform="translate(250, 180)" filter="url(#glowMythic)">
    <!-- Left Wings -->
    <path d="M -20,-10 Q -90,-80 -170,-40 Q -120,-10 -90,40 Q -50,10 -20,0 Z" fill="url(#cyanWings)" opacity="0.85"/>
    <path d="M -30,0 Q -110,-40 -190,10 Q -130,30 -100,80 Q -60,40 -30,10 Z" fill="url(#cyanWings)" opacity="0.7"/>
    <!-- Right Wings -->
    <path d="M 20,-10 Q 90,-80 170,-40 Q 120,-10 90,40 Q 50,10 20,0 Z" fill="url(#cyanWings)" opacity="0.85"/>
    <path d="M 30,0 Q 110,-40 190,10 Q 130,30 100,80 Q 60,40 30,10 Z" fill="url(#cyanWings)" opacity="0.7"/>
  </g>

  <!-- Mythic X-Suit Character & Crown Armor -->
  <g transform="translate(250, 190)">
    <!-- Shoulders & Chest Armor -->
    <path d="M -65,30 L -90,65 L -45,110 L 45,110 L 90,65 L 65,30 L 35,50 L -35,50 Z" fill="url(#goldArmor)" filter="url(#glowMythic)"/>
    <path d="M -35,50 L 0,85 L 35,50 L 0,20 Z" fill="#38bdf8" filter="url(#glowMythic)"/>

    <!-- Glowing Core Crystal -->
    <polygon points="0,45 16,65 0,85 -16,65" fill="#ffffff" filter="url(#glowMythic)"/>

    <!-- Helmet / Face & Crown -->
    <path d="M -25,-40 Q 0,-70 25,-40 L 30,5 Q 0,25 -30,5 Z" fill="#0f172a"/>
    <path d="M -22,-30 L -30,-60 L -12,-45 L 0,-75 L 12,-45 L 30,-60 L 22,-30 Z" fill="url(#goldArmor)" filter="url(#glowMythic)"/>
    <!-- Visor Eye Glow -->
    <ellipse cx="-8" cy="-15" rx="5" ry="3" fill="#38bdf8" filter="url(#glowMythic)"/>
    <ellipse cx="8" cy="-15" rx="5" ry="3" fill="#38bdf8" filter="url(#glowMythic)"/>
  </g>

  <!-- 7-Star Mythic Rank Stars -->
  <g transform="translate(250, 310)" fill="#ffd700" filter="url(#glowMythic)">
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(-60,0) scale(1.1)"/>
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(-40,0) scale(1.1)"/>
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(-20,0) scale(1.1)"/>
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(0,0) scale(1.3)"/>
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(20,0) scale(1.1)"/>
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(40,0) scale(1.1)"/>
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" transform="translate(60,0) scale(1.1)"/>
  </g>

  <!-- X-SUITS Banner Label -->
  <g transform="translate(250, 390)">
    <rect x="-150" y="-35" width="300" height="52" rx="10" fill="rgba(10, 5, 24, 0.95)" stroke="#c084fc" stroke-width="2.5" filter="url(#glowMythic)"/>
    <text x="0" y="-8" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="3" font-family="sans-serif">PUBG MOBILE</text>
    <text x="0" y="10" fill="#e9d5ff" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="4" font-family="sans-serif">7-STAR X-SUITS</text>
  </g>
</svg>
